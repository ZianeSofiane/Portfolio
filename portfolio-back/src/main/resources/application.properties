spring.application.name=portfolio-backend
spring.config.import=optional:file:.env.local[.properties]

# Port du serveur back-end (différent d'Angular pour éviter les conflits)
server.port=8080

# Configuration de la base de données H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:portfoliodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 activée pour visualiser les données en dev (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Affichage des requêtes SQL dans la console
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
