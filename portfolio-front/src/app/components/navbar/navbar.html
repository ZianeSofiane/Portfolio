<nav class="bg-nav border-b border-nav-border text-content sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <div class="flex items-center">
        <a routerLink="/" fragment="hero" class="text-xl font-bold text-accent">Sofiane.dev</a>
      </div>

      <div class="hidden md:flex space-x-8">
        <a routerLink="/" fragment="resume" class="nav-link">{{ i18n.translate('nav.resume') }}</a>
        <a routerLink="/" fragment="missions" class="nav-link">{{ i18n.translate('nav.missions') }}</a>
        <a routerLink="/" fragment="projects" class="nav-link">{{ i18n.translate('nav.projects') }}</a>
