services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_portfolio
    restart: always
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ton_mot_de_passe_securise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./portfolio-back
      dockerfile: Dockerfile
    container_name: backend_portfolio
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/portfolio_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=ton_mot_de_passe_securise
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres

  frontend:
    build:
      context: ./portfolio-front
      dockerfile: Dockerfile
    container_name: frontend_portfolio
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
